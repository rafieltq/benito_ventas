# configure the MongoDB client for a replica set of two nodes
quarkus.mongodb.connection-string = mongodb://localhost:27017
# mandatory if you don't specify the name of the database using @MongoEntity
quarkus.mongodb.database = facturacion

# JWT
# Public verification key
mp.jwt.verify.publickey.location=/jwt/publicKey.pem
# Required issuer
mp.jwt.verify.issuer=https://example.com/issuer

#Priority
quarkus.smallrye-jwt.priority=2000

quarkus.native.resources.includes=publicKey.pem

# Certificado y clave privada de Productos
quarkus.tls.key-store.pem.0.cert=/certs/server.crt
quarkus.tls.key-store.pem.0.key=/certs/server.key

# CA de confianza para validar a los clientes
quarkus.tls.trust-store.pem.certs=/certs/ca.crt

# Exigir certificado cliente
quarkus.http.ssl.client-auth=required

# Puerto HTTPS
quarkus.http.ssl-port=8443

# Deshabilitar HTTP sin cifrar
quarkus.http.insecure-requests=disabled

# Internal service calls use mTLS and retain hostname verification.
quarkus.rest-client.clientes.url=https://clientes:8443
quarkus.rest-client.clientes.tls-configuration-name=servicios
quarkus.rest-client.clientes.connect-timeout=3000
quarkus.rest-client.clientes.read-timeout=5000
quarkus.rest-client.clientes.disable-default-mapper=true

quarkus.rest-client.productos.url=https://productos:8443
quarkus.rest-client.productos.tls-configuration-name=servicios
quarkus.rest-client.productos.connect-timeout=3000
quarkus.rest-client.productos.read-timeout=5000
quarkus.rest-client.productos.disable-default-mapper=true

quarkus.tls.servicios.key-store.pem.0.cert=/certs/client.crt
quarkus.tls.servicios.key-store.pem.0.key=/certs/client.key
quarkus.tls.servicios.trust-store.pem.certs=/certs/ca.crt


