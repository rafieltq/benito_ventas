  services:
     traefik:
      image: traefik:v3.7
      container_name: traefik
      restart: unless-stopped
      security_opt:
        - no-new-privileges:true
      networks:
        - proxy
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - ${HOME}/certs/traefik:/certs:ro
        - ./infra/traefik/dynamic:/dynamic:ro
      command:
        - "--entrypoints.web.address=:80"
        - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
        - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
        - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
        - "--entrypoints.websecure.address=:443"
        - "--entrypoints.websecure.http.tls=true"
        - "--providers.file.filename=/dynamic/tls.yaml"
        - "--providers.docker=true"
        - "--providers.docker.exposedbydefault=false"
        - "--providers.docker.network=proxy"
        - "--api.dashboard=true"
        - "--api.insecure=false"
        - "--log.level=INFO"
        - "--accesslog=true"
        - "--metrics.prometheus=true"
        - "--providers.docker.constraints=Label(`com.benitoventas.proxy`, `true`)"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard.rule=Host(`dashboard.docker.localhost`)"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.tls=true"
        - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$nWrMzXr9$$Olmxu4gxTFWqmMFC78MhM1"
        - "traefik.http.routers.dashboard.middlewares=dashboard-auth@docker"
        - "com.benitoventas.proxy=true"

     productos-mongo:
       image: mongo:8.0
       ports:
         - "27018:27017"
       volumes:
         - productos_mongo_data:/data/db
         - productos_mongo_config:/data/configdb
       networks:
         - proxy
       healthcheck:
         test:
           - CMD
           - mongosh
           - --quiet
           - --eval
           - "quit(db.adminCommand('ping').ok ? 0 : 1)"
         interval: 5s
         timeout: 5s
         retries: 10
         start_period: 10s

     productos:
       build:
         context: ./productos
         dockerfile: src/main/docker/Dockerfile.jvm
       networks:
         - proxy
       labels:
         - "traefik.enable=true"
         - "traefik.http.routers.productos.rule=Host(`productos.benito.localhost`) && (Method(`GET`) || Method(`HEAD`))"
         - "traefik.http.routers.productos.entrypoints=websecure"
         - "traefik.http.routers.productos.tls=true"
         - "com.benitoventas.proxy=true"
         - "traefik.http.routers.productos.service=productos"
         - "traefik.http.routers.productos-admin.rule=Host(`productos.admin.benito.localhost`)"
         - "traefik.http.routers.productos-admin.entrypoints=websecure"
         - "traefik.http.routers.productos-admin.service=productos"
         - "traefik.http.routers.productos-admin.tls=true"
         - "traefik.http.routers.productos-admin.tls.options=admin-mtls@file"
         - "traefik.http.services.productos.loadbalancer.server.port=8443"
         - "traefik.http.services.productos.loadbalancer.server.scheme=https"
         - "traefik.http.services.productos.loadbalancer.serverstransport=productos-mtls@file"
       environment:
         QUARKUS_MONGODB_CONNECTION_STRING: mongodb://productos-mongo:27017
         QUARKUS_MONGODB_DATABASE: productos
       depends_on:
         productos-mongo:
           condition: service_healthy
       volumes:
          - ${HOME}/certs/productos:/certs:ro
          - ${HOME}/certs/jwt/publicKey.pem:/jwt/publicKey.pem:ro

     auth-mongodb:
       image: mongo:8.0
       ports:
         - "27019:27017"
       volumes:
         - auth_mongodb_data:/data/db
         - auth_mongodb_config:/data/configdb
       networks:
         - proxy
       healthcheck:
         test:
           - CMD
           - mongosh
           - --quiet
           - --eval
           - "quit(db.adminCommand('ping').ok ? 0 : 1)"
         interval: 5s
         timeout: 5s
         retries: 10
         start_period: 10s

     auth:
       build:
         context: ./auth
         dockerfile: src/main/docker/Dockerfile.jvm
       networks:
         - proxy
       labels:
         - "traefik.enable=true"
         - "traefik.http.routers.auth.rule=Host(`auth.benito.localhost`) && (Path(`/auth/me`) || Path(`/auth/clientes/signup`) || Path(`/auth/clientes/login`))"
         - "traefik.http.routers.auth.entrypoints=websecure"
         - "traefik.http.routers.auth.tls=true"
         - "com.benitoventas.proxy=true"
         - "traefik.http.routers.auth.service=auth"
         - "traefik.http.routers.auth-admin.rule=Host(`auth.admin.benito.localhost`)"
         - "traefik.http.routers.auth-admin.entrypoints=websecure"
         - "traefik.http.routers.auth-admin.service=auth"
         - "traefik.http.routers.auth-admin.tls=true"
         - "traefik.http.routers.auth-admin.tls.options=admin-mtls@file"
         - "traefik.http.services.auth.loadbalancer.server.port=8443"
         - "traefik.http.services.auth.loadbalancer.server.scheme=https"
         - "traefik.http.services.auth.loadbalancer.serverstransport=auth-mtls@file"
       environment:
         QUARKUS_MONGODB_CONNECTION_STRING: mongodb://auth-mongodb:27017
         QUARKUS_MONGODB_DATABASE: auth
         MP_JWT_VERIFY_PUBLICKEY_LOCATION: /jwt/publicKey.pem
         SMALLRYE_JWT_SIGN_KEY_LOCATION: /jwt/privateKey.pem
       depends_on:
         auth-mongodb:
           condition: service_healthy
         clientes:
           condition: service_started
       volumes:
         - ${HOME}/certs/auth:/certs:ro
         - ${HOME}/certs/jwt:/jwt:ro

     clientes-mongodb:
       image: mongo:8.0
       ports:
         - "27020:27017"
       volumes:
         - clientes_mongodb_data:/data/db
         - clientes_mongodb_config:/data/configdb
       networks:
         - proxy
       healthcheck:
         test:
           - CMD
           - mongosh
           - --quiet
           - --eval
           - "quit(db.adminCommand('ping').ok ? 0 : 1)"
         interval: 5s
         timeout: 5s
         retries: 10
         start_period: 10s

     clientes:
       build:
         context: ./clientes
         dockerfile: src/main/docker/Dockerfile.jvm
       networks:
         - proxy
       labels:
         - "traefik.enable=true"
         - "traefik.http.routers.clientes.rule=Host(`clientes.benito.localhost`) && (Method(`GET`) || Method(`HEAD`))"
         - "traefik.http.routers.clientes.entrypoints=websecure"
         - "traefik.http.routers.clientes.tls=true"
         - "com.benitoventas.proxy=true"
         - "traefik.http.routers.clientes.service=clientes"
         - "traefik.http.routers.clientes-admin.rule=Host(`clientes.admin.benito.localhost`)"
         - "traefik.http.routers.clientes-admin.entrypoints=websecure"
         - "traefik.http.routers.clientes-admin.service=clientes"
         - "traefik.http.routers.clientes-admin.tls=true"
         - "traefik.http.routers.clientes-admin.tls.options=admin-mtls@file"
         - "traefik.http.services.clientes.loadbalancer.server.port=8443"
         - "traefik.http.services.clientes.loadbalancer.server.scheme=https"
         - "traefik.http.services.clientes.loadbalancer.serverstransport=clientes-mtls@file"
       environment:
         QUARKUS_MONGODB_CONNECTION_STRING: mongodb://clientes-mongodb:27017
         QUARKUS_MONGODB_DATABASE: clientes
       depends_on:
         clientes-mongodb:
           condition: service_healthy
       volumes:
         - ${HOME}/certs/clientes:/certs:ro
         - type: bind
           source: ${HOME}/certs/jwt/publicKey.pem
           target: /jwt/publicKey.pem
           read_only: true
           bind:
             create_host_path: false

     facturacion-mongodb:
       image: mongo:8.0
       ports:
         - "27021:27017"
       volumes:
         - facturacion_mongodb_data:/data/db
         - facturacion_mongodb_config:/data/configdb
       command: ["mongod", "--replSet", "rs-facturacion", "--bind_ip_all"]
       networks:
         - proxy
       healthcheck:
         test:
           - CMD
           - mongosh
           - --quiet
           - --eval
           - >-
             try {
               rs.status();
             } catch (e) {
               if (e.code !== 94) throw e;
               rs.initiate({_id: 'rs-facturacion', members: [{_id: 0, host: 'facturacion-mongodb:27017'}]});
             }
             quit(db.hello().isWritablePrimary ? 0 : 1);
         interval: 5s
         timeout: 5s
         retries: 10
         start_period: 10s

     facturacion:
       build:
         context: ./facturacion
         dockerfile: src/main/docker/Dockerfile.jvm
       networks:
         - proxy
       labels:
         - "traefik.enable=true"
         - "traefik.http.routers.facturacion.rule=Host(`facturacion.benito.localhost`) && (Method(`GET`) || Method(`HEAD`) || (Method(`POST`) && (Path(`/ordenes`) || Path(`/depositos`))))"
         - "traefik.http.routers.facturacion.entrypoints=websecure"
         - "traefik.http.routers.facturacion.tls=true"
         - "com.benitoventas.proxy=true"
         - "traefik.http.routers.facturacion.service=facturacion"
         - "traefik.http.routers.facturacion-admin.rule=Host(`facturacion.admin.benito.localhost`)"
         - "traefik.http.routers.facturacion-admin.entrypoints=websecure"
         - "traefik.http.routers.facturacion-admin.service=facturacion"
         - "traefik.http.routers.facturacion-admin.tls=true"
         - "traefik.http.routers.facturacion-admin.tls.options=admin-mtls@file"
         - "traefik.http.services.facturacion.loadbalancer.server.port=8443"
         - "traefik.http.services.facturacion.loadbalancer.server.scheme=https"
         - "traefik.http.services.facturacion.loadbalancer.serverstransport=facturacion-mtls@file"
       environment:
         QUARKUS_MONGODB_CONNECTION_STRING: mongodb://facturacion-mongodb:27017/?replicaSet=rs-facturacion
         QUARKUS_MONGODB_DATABASE: facturacion
       depends_on:
         facturacion-mongodb:
           condition: service_healthy
       volumes:
         - ${HOME}/certs/facturacion:/certs:ro
         - type: bind
           source: ${HOME}/certs/jwt/publicKey.pem
           target: /jwt/publicKey.pem
           read_only: true
           bind:
             create_host_path: false

     kafka:
        image: apache/kafka:latest
        container_name: kafka
        networks:
          - proxy
        environment:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_LISTENERS: SSL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: SSL://kafka:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SSL:SSL,CONTROLLER:SSL
          KAFKA_INTER_BROKER_LISTENER_NAME: SSL
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_SSL_CLIENT_AUTH: required
          KAFKA_SSL_KEYSTORE_TYPE: PKCS12
          KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.p12
          KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore.password
          KAFKA_SSL_KEY_CREDENTIALS: keystore.password
          KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
          KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.p12
          KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore.password
        volumes:
          - ${HOME}/certs/kafka:/etc/kafka/secrets:ro

  volumes:
    productos_mongo_data:
    productos_mongo_config:
    auth_mongodb_data:
    auth_mongodb_config:
    clientes_mongodb_data:
    clientes_mongodb_config:
    facturacion_mongodb_data:
    facturacion_mongodb_config:

  networks:
    proxy:
      external: true
