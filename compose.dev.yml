services:
  auth:
    build: !reset null
    image: maven:3.9-eclipse-temurin-25
    working_dir: /workspace
    command:
      - mvn
      - quarkus:dev
      - -Dquarkus.http.host=0.0.0.0
      - -Ddebug=false
    volumes:
      - ./auth:/workspace
      - auth_dev_target:/workspace/target
      - maven_cache:/root/.m2

  productos:
    build: !reset null
    image: maven:3.9-eclipse-temurin-25
    working_dir: /workspace
    command:
      - mvn
      - quarkus:dev
      - -Dquarkus.http.host=0.0.0.0
      - -Ddebug=false
    volumes:
      - ./productos:/workspace
      - productos_dev_target:/workspace/target
      - maven_cache:/root/.m2

volumes:
  auth_dev_target:
  productos_dev_target:
  maven_cache:
