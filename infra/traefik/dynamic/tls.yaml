tls:
  certificates:
    - certFile: /certs/local.crt
      keyFile: /certs/local.key

http:
  serversTransports:
    auth-mtls:
      serverName: auth
      rootCAs:
        - /certs/ca.crt
      certificates:
        - certFile: /certs/client.crt
          keyFile: /certs/client.key
    productos-mtls:
      serverName: productos
      rootCAs:
        - /certs/ca.crt
      certificates:
        - certFile: /certs/client.crt
          keyFile: /certs/client.key

