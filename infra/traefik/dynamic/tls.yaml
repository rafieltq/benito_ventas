tls:
  certificates:
    - certFile: /certs/local.crt
      keyFile: /certs/local.key
    - certFile: /certs/clientes-local.crt
      keyFile: /certs/clientes-local.key

http:
  serversTransports:
    facturacion-mtls:
      serverName: facturacion
      rootCAs:
        - /certs/ca.crt
      certificates:
        - certFile: /certs/client.crt
          keyFile: /certs/client.key
    clientes-mtls:
      serverName: clientes
      rootCAs:
        - /certs/ca.crt
      certificates:
        - certFile: /certs/client.crt
          keyFile: /certs/client.key
    auth-mtls:
      serverName: auth
      rootCAs:
        - /certs/ca.crt
      certificates:
        - certFile: /certs/client.crt
          keyFile: /certs/client.key
    productos-mtls:
      serverName: productos
      rootCAs:
        - /certs/ca.crt
      certificates:
        - certFile: /certs/client.crt
          keyFile: /certs/client.key

