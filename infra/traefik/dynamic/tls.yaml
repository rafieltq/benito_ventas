tls:
  certificates:
    - certFile: /certs/local.crt
      keyFile: /certs/local.key
    - certFile: /certs/clientes-local.crt
      keyFile: /certs/clientes-local.key
    - certFile: /certs/admin-services.crt
      keyFile: /certs/admin-services.key

  options:
    admin-mtls:
      minVersion: VersionTLS12
      clientAuth:
        caFiles:
          - /certs/admin-ca.crt
        clientAuthType: RequireAndVerifyClientCert

http:
  serversTransports:
    facturacion-mtls:
      serverName: facturacion
      rootCAs:
        - /certs/ca.crt
      certificates:
        - certFile: /certs/client.crt
          keyFile: /certs/client.key
    clientes-mtls:
      serverName: clientes
      rootCAs:
        - /certs/ca.crt
      certificates:
        - certFile: /certs/client.crt
          keyFile: /certs/client.key
    auth-mtls:
      serverName: auth
      rootCAs:
        - /certs/ca.crt
      certificates:
        - certFile: /certs/client.crt
          keyFile: /certs/client.key
    productos-mtls:
      serverName: productos
      rootCAs:
        - /certs/ca.crt
      certificates:
        - certFile: /certs/client.crt
          keyFile: /certs/client.key
